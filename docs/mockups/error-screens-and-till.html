  .ic.nv { background: rgba(19,31,59,.08); color: var(--pri); } .ic.or { background: rgba(243,174,61,.24); color: var(--warn-ink); } .ic.rd { background: rgba(222,0,19,.1); color: var(--bad); }

  .sum .amt { font-size: 28px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
  .tag { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 8px; background: #F0F0F0; color: var(--fg); display: inline-flex; gap: 6px; align-items: center; }
  .warnbox { border-radius: 12px; padding: 12px 14px; text-align: left; font-weight: 700; display: flex; gap: 10px; align-items: flex-start; }
  .warnbox.or { background: rgba(243,174,61,.2); color: var(--warn-ink); } .warnbox svg { width: 20px; height: 20px; margin-top: 1px; }
  .stack { display: grid; gap: 8px; margin-top: 4px; }
  .panel { flex: none; display: grid; gap: 10px; padding: 16px; background: var(--card); border-top: 4px solid var(--pri); }
  .panel .top { display: flex; gap: 12px; align-items: center; }
  .panel .ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none; }
  .alert { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 32px; }
  .alert div { background: #fff; border-radius: 6px; padding: 20px 24px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .alert b { font-size: 18px; display: block; margin-bottom: 8px; } .alert p { margin: 0; color: #555; } .alert u { display: block; text-align: right; text-decoration: none; color: #00796B; font-weight: 700; margin-top: 16px; font-size: 14px; }

<script>

/* ---------- Web ---------- */
const NAV = [['dash', 'Επισκόπηση'], ['store', 'Ταμείο & τιμολόγηση'], ['rec', 'Συνταγολόγιο'], ['dev', 'Παραγωγή'], ['dash', 'Αποθήκη & αγορές'], ['store', 'Πελάτες & πωλήσεις'], ['rec', 'Ομάδα & δεδομένα'], ['dev', 'Υποστήριξη']];
const WEB = {

    p: 'Η διεύθυνση μπορεί να άλλαξε ή να γράφτηκε λάθος. Δεν χάλασε τίποτα: διάλεξε από το μενού ή γύρνα πίσω.',

const hd = '<div class="hd" style="padding:16px 16px 0"><h4>Ταμείο</h4><p class="mu">Gelateria Πλάκα · Ταμείο 1 · σειρά ΑΛΠ</p></div>';
const shop = (n) => `${hd}<div class="chips">${['Παγωτό', 'Γρανίτες', 'Καφές', 'Γλυκά'].map((c, i) => `<span class="chip${i ? '' : ' on'}">${c}</span>`).join('')}</div><div class="grid">${PRODUCTS.slice(0, n).map(([a, b, q]) => `<div class="prod"><b>${a}</b><i>${b}${q}</i></div>`).join('')}</div>`;
const lines = [['Χωνάκι 1 μπάλα', 1], ['Χωνάκι 2 μπάλες', 1]].map(([n, q]) => `<div class="ln"><span style="flex:1">${n}</span><span class="q">−</span><span style="width:28px;text-align:center;font-weight:800">${q}</span><span class="q">+</span></div>`).join('');
const sum = (extra = '') => `<div class="sum"><div class="amt">6,50 €<span class="tag">${s('card')}Κάρτα</span></div><p class="mu">2 είδη · ξεκίνησε 12:38${extra}</p></div>`;
const full = (tone, icon, h, p, rest) => `<div class="full"><div class="ic ${tone}">${s(icon)}</div><h4>${h}</h4><p class="mu">${p}</p>${rest}</div>`;
const TILL = {
  pair: `<div class="pair"><div class="lbox"><div>GELATO <span>SYSTEM</span></div></div><h4>Σύζευξη ταμείου</h4><p class="mu">Γράψε τη διεύθυνση της εφαρμογής και τον 8ψήφιο κωδικό σύζευξης που σου έδωσε ο διαχειριστής. Ισχύει 15 λεπτά.</p><div class="inp">https://app.gelatosystem.app</div><div class="inp" style="letter-spacing:4px;font-weight:800">K7M2QX9A</div><div class="tb fixed">Σύζευξη</div></div>`,
  pos: `${shop(4)}<div class="cart">${lines}<div class="ln"><span class="mu">Σύνολο</span><span class="tot">6,50 €</span></div><div class="two"><div class="tb ok">Μετρητά</div><div class="tb">Κάρτα</div></div></div>`,
  nowAlert: `${shop(4)}<div class="cart">${lines}<div class="ln"><span class="mu">Σύνολο</span><span class="tot">6,50 €</span></div><div class="two"><div class="tb ok off">Μετρητά</div><div class="tb off">Κάρτα</div></div></div><div class="alert"><div><b>Δεν ενημερώθηκε ο server</b><p>Η πληρωμή έγινε αλλά η απόδειξη δεν καταχωρήθηκε. Μην ξαναχρεώσεις: ενημέρωσε τον υπεύθυνο.</p><u>OK</u></div></div>`,
  waitA: full('nv', 'spin', 'Περιμένουμε την πληρωμή', 'Ολοκλήρωσέ την στο Viva Terminal. Η οθόνη αλλάζει μόνη της μόλις τελειώσει.', `${sum()}<div class="stack"><div class="tb fixed">Άνοιξε το Viva Terminal</div><div class="tb fixed out">Έλεγξε αν πληρώθηκε</div></div>`),
  waitB: `<div class="dim" style="display:contents">${shop(4)}</div><div class="panel"><div class="top"><div class="ic nv">${s('spin')}</div><div style="flex:1"><b style="font-size:17px">Περιμένουμε την πληρωμή</b><p class="mu">Κάρτα · 2 είδη · ξεκίνησε 12:38</p></div><span class="tot">6,50 €</span></div><p class="mu">Ολοκλήρωσέ την στο Viva Terminal. Το καλάθι είναι κλειδωμένο μέχρι να τελειώσει.</p><div class="two"><div class="tb out">Έλεγξε αν πληρώθηκε</div><div class="tb">Viva Terminal</div></div></div>`,
  resume: full('or', 'clock', 'Έμεινε μια πληρωμή στη μέση', 'Η εφαρμογή έκλεισε πριν μάθουμε αν πληρώθηκε. Το καλάθι της είναι ακόμα εδώ.', `${sum()}<div class="warnbox or">${s('warn')}<span>Μην χρεώσεις ξανά τον πελάτη πριν δεις το αποτέλεσμα.</span></div><div class="stack"><div class="tb fixed">Έλεγξε αν πληρώθηκε</div></div>`),
  unknown: full('or', 'clock', 'Δεν ξέρουμε ακόμα αν πληρώθηκε', 'Η Viva δεν απάντησε. Ρωτάμε ξανά μόνοι μας κάθε λίγα δευτερόλεπτα.', `${sum(' · τελευταίος έλεγχος 12:41')}<div class="warnbox or">${s('warn')}<span>Μην χρεώσεις ξανά τον πελάτη. Αν βιάζεται, σημείωσε ώρα και ποσό και πες το στον υπεύθυνο.</span></div><div class="stack"><div class="tb fixed">${s('retry')}Έλεγξε ξανά τώρα</div></div>`),
  failed: full('rd', 'x', 'Η πληρωμή δεν έγινε', 'Ο πελάτης δεν χρεώθηκε. Το καλάθι είναι όπως το άφησες.', `${sum()}<div class="stack"><div class="tb fixed">Δοκίμασε ξανά με κάρτα</div><div class="tb fixed ok">Πληρωμή με μετρητά</div><div class="tb fixed txt">Πίσω στο καλάθι</div></div>`),
  key: full('rd', 'link', 'Το ταμείο αποσυνδέθηκε', 'Το κλειδί αυτής της συσκευής δεν ισχύει πια, γι\' αυτό δεν εκδίδει αποδείξεις.', `<div class="sum"><b>Τι κάνεις τώρα</b><p class="mu">Ζήτα από τον διαχειριστή νέο κωδικό σύζευξης. Τον βγάζει από «Συσκευές» στην κονσόλα.</p></div><div class="stack"><div class="tb fixed">Νέα σύζευξη</div></div><p class="mu">Gelateria Πλάκα · Ταμείο 1</p>`),
};
const till = (k) => `<div class="till">${sb}${TILL[k]}</div>`;
const fig = (html, cap) => `<figure>${html}<figcaption>${cap}</figcaption></figure>`;

const webBoard = (dark) => `
  <div class="row">${fig(web('error', 1280, dark, 1), '<b>A1 · Σφάλμα μέσα στην εφαρμογή, 1280px.</b> Το μενού μένει. Κόκκινο = κάτι χάλασε. Το πρώτο κουμπί φαίνεται με εστίαση πληκτρολογίου.')}${fig(web('error', 360, dark), '<b>A1 · 360px.</b> Κουμπιά 44px, ένα κάτω από το άλλο.')}</div>
  <div class="row">${fig(web('global', 1280, dark), '<b>A2 · Σφάλμα σε όλη τη σελίδα, 1280px.</b> Χωρίς μενού: ίδια κάρτα με τη σύνδεση.')}${fig(web('global', 360, dark), '<b>A2 · 360px.</b>')}</div>
  <div class="row">${fig(web('notfound', 1280, dark), '<b>A3 · Η σελίδα δεν βρέθηκε, μέσα στην εφαρμογή, 1280px.</b> Ουδέτερο γκρι: δεν χάλασε τίποτα.')}${fig(web('notfound', 360, dark), '<b>A3 · 360px.</b>')}</div>
  <div class="row">${fig(web('link', 1280, dark), '<b>A4 · Δημόσιος σύνδεσμος που δεν ισχύει, 1280px.</b> Πορτοκαλί = έληξε. Ο επισκέπτης δεν έχει λογαριασμό, άρα κανένα κουμπί προς την εφαρμογή.')}${fig(web('link', 360, dark), '<b>A4 · 360px.</b>')}</div>`;

const BOARDS = {
  'a-light': ['A · Οθόνες σφάλματος web, φωτεινό θέμα', 'Στη θέση του λογοτύπου μπαίνει το πραγματικό logo.png. Ο κωδικός υποστήριξης είναι ανοιχτή ερώτηση.', webBoard(0)],
  'a-dark': ['A · Οθόνες σφάλματος web, σκοτεινό θέμα', '', webBoard(1)],
  'b-now': ['B1 · Το ταμείο Android όπως είναι σήμερα', 'Δύο οθόνες. Τα λάθη εμφανίζονται ως παράθυρο του Android με ένα OK.', `<div class="row">${fig(till('pair'), '<b>Σήμερα 1 · Σύζευξη.</b> Διεύθυνση εφαρμογής και κωδικός 8 χαρακτήρων.')}${fig(till('pos'), '<b>Σήμερα 2 · Ταμείο.</b> Κατηγορίες, προϊόντα, καλάθι με − / +, σύνολο. «Μετρητά» και «Κάρτα» ανοίγουν και τα δύο το Viva Terminal.')}${fig(till('nowAlert'), '<b>Σήμερα 3 · Όταν κάτι πάει στραβά.</b> Ένα παράθυρο με OK. Μετά το OK η εφαρμογή ξεχνά την πληρωμή.')}</div>`],
  'b-new': ['B2 · Οι καταστάσεις πληρωμής που λείπουν', 'Καμία νέα λειτουργία: μόνο το τι βλέπει ο ταμίας από τη στιγμή που πατά «Κάρτα» ή «Μετρητά» μέχρι να μάθει το αποτέλεσμα.', `
    <div class="row">${fig(till('waitA'), '<b>Παραλλαγή 1 · Ολόκληρη οθόνη.</b> Πληρωμή σε εξέλιξη. Δεν πατιέται τίποτα άλλο, άρα δεν γίνεται δεύτερη χρέωση κατά λάθος.')}${fig(till('waitB'), '<b>Παραλλαγή 2 · Πλαίσιο στη θέση του καλαθιού.</b> Ο ταμίας βλέπει ακόμα τα προϊόντα, θαμπά και κλειδωμένα.')}</div>
    <div class="row">${fig(till('resume'), '<b>B2.2 · Συνέχεια μετά από κλείσιμο.</b> Εμφανίζεται στο άνοιγμα της εφαρμογής, πριν από το ταμείο.')}${fig(till('unknown'), '<b>B2.3 · Άγνωστο αποτέλεσμα.</b> Πορτοκαλί = περιμένει. Χωρίς ποσοστό ή χρόνο που δεν ξέρουμε.')}${fig(till('failed'), '<b>B2.4 · Η πληρωμή απέτυχε.</b> Κόκκινο. Λέει καθαρά ότι ο πελάτης δεν χρεώθηκε.')}${fig(till('key'), '<b>B2.5 · Το κλειδί της συσκευής δεν ισχύει.</b> Λέει τι να ζητήσει και από ποιον.')}</div>`],
};
const W = innerWidth, narrow = W < 760, root = document.getElementById('mock');
const board = (id) => { const [h, p, html] = BOARDS[id]; return `<section class="board" id="${id}"><h2>${h}</h2><p>${p}</p>${html}</section>`; };
if (narrow) {
  root.className = 'narrow'; root.style.padding = 0; root.style.background = 'none';
  root.style.setProperty('--zd', Math.min(1, (W - 2) / 1282));
  root.style.setProperty('--zp', W >= 600 ? Math.min(1, (W - 14) / 2 / 362) : Math.min(1, (W - 2) / 362));
  const T = { 'a-light': 'Web · φωτεινό', 'a-dark': 'Web · σκοτεινό', 'b-now': 'Ταμείο · σήμερα', 'b-new': 'Ταμείο · νέες καταστάσεις' };
  const show = (id) => { root.innerHTML = `<div class="tabs">${Object.keys(T).map((k) => `<button aria-pressed="${k === id}" data-k="${k}">${T[k]}</button>`).join('')}</div>${board(id)}`; };
  root.addEventListener('click', (e) => { const k = e.target.dataset && e.target.dataset.k; if (k) show(k); });
  show('a-light');
} else {
  const only = location.hash.slice(1);
  root.innerHTML = Object.keys(BOARDS).filter((id) => !only || id === only).map(board).join('');
}
</script>
</body>
</html>
