<!doctype html><meta charset="utf-8"><title>Gelato Central · mockup</title><body style="margin:16px;font:14px system-ui">
<style>
.tw{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.tw h3{font-size:15px;font-weight:600;margin:20px 0 4px}.tw .cap{margin:0 0 12px;color:var(--muted-foreground,#555);font-size:13px}
.tg{display:flex;gap:8px}.tg button{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--border,#ccc);background:var(--card,#fff);color:var(--foreground,#111);font:600 14px system-ui;cursor:pointer}
.tg button[aria-pressed=true]{background:var(--primary,#131F3B);color:var(--primary-foreground,#fff)}
.x{--bg:oklch(.17 .02 262);--p:oklch(.205 .022 262);--r:oklch(.255 .026 262);--fg:oklch(.94 .005 262);--mu:oklch(.7 .02 262);--fa:oklch(.52 .02 262);--ln:oklch(1 0 0/.085);--act:oklch(.79 .09 85);--on:oklch(.2 .03 85);--wait:oklch(.8 .13 80);--ok:oklch(.75 .13 155);--bad:oklch(.7 .17 22);--sel:oklch(.94 .005 262/.5);
background:var(--bg);color:var(--fg);font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums;border:1px solid var(--border,#ccc);border-radius:8px;padding:16px;display:grid;gap:16px;overflow:hidden}
.x.lt{--bg:oklch(.965 .005 85);--p:oklch(1 0 0);--r:oklch(.93 .006 85);--fg:oklch(.25 .03 262);--mu:oklch(.5 .02 262);--fa:oklch(.68 .015 262);--ln:oklch(.25 .03 262/.11);--act:oklch(.245 .055 264);--on:oklch(.98 .005 85);--wait:oklch(.5 .12 65);--ok:oklch(.45 .11 155);--bad:oklch(.52 .2 25);--sel:oklch(.25 .03 262/.5)}
.x svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sh{background:var(--p);border:1px solid var(--ln);border-radius:6px;overflow:hidden}
.hd{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-bottom:1px solid var(--ln)}.hd b{font-size:14px;font-weight:600}.hd span{margin-left:auto;color:var(--mu)}
.m{color:var(--mu)}.f{color:var(--fa)}.n{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px}
.two{display:grid;grid-template-columns:1fr 1fr}.two>div{padding:16px}.two>div+div{border-left:1px solid var(--ln)}
.big{font-size:30px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px}.kp i{height:48px;border-radius:3px;background:var(--r);display:grid;place-items:center;font-style:normal;font-size:17px;font-weight:500}
.qk{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px}.qk i{height:40px;border:1px solid var(--ln);border-radius:3px;display:grid;place-items:center;font-style:normal;font-weight:500}.qk .on{border-color:var(--sel);background:var(--r)}
.rw{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--ln)}
.btn{height:48px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;padding:0 16px}
.btn.a{background:var(--act);color:var(--on)}.btn.o{border:1px solid var(--ln);color:var(--fg);font-weight:500}.btn.off{opacity:.45}
.lb{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:4px;font-weight:600;font-size:11.5px;background:color-mix(in oklab,currentColor 14%,transparent)}
.ok{color:var(--ok)}.wt{color:var(--wait)}.bd{color:var(--bad)}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stc{padding:16px;display:grid;gap:8px;align-content:start;border-top:3px solid currentColor}.stc>*{color:var(--fg)}.stc p{margin:0;color:var(--mu)}.stc h4{margin:0;font-size:15px;font-weight:600}
.stc .lb{color:inherit;justify-self:start}.stc.ok .lb{color:var(--ok)}.stc.wt .lb{color:var(--wait)}.stc.bd .lb{color:var(--bad)}.stc.nu{color:var(--fa)}.stc.nu .lb{color:var(--mu)}
.acts{display:flex;gap:8px;margin-top:4px}.acts .btn{height:40px;font-size:13px;flex:1}
.gp{padding:14px 16px;border-bottom:1px solid var(--ln)}.gh{display:flex;align-items:center;gap:8px;margin-bottom:10px}.gh b{font-weight:600}.gh .lb{margin-left:auto}
.op{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.op i{min-height:44px;border:1px solid var(--ln);border-radius:3px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-style:normal;font-weight:500}
.op i small{color:var(--mu);font-weight:400;white-space:nowrap}.op .on{background:var(--r);border-color:var(--sel);box-shadow:inset 3px 0 0 var(--fg)}.op .x0{color:var(--fa);text-decoration:line-through}
.ft{display:flex;align-items:center;gap:12px;padding:12px 16px}.stp{display:flex;align-items:center;border:1px solid var(--ln);border-radius:6px;height:48px}.stp i{width:44px;text-align:center;font-style:normal;font-size:18px;color:var(--mu)}.stp b{width:28px;text-align:center}
</style>
<div class="tw"><div class="tg"><button data-t="" aria-pressed="true">Σκοτεινό</button><button data-t="lt" aria-pressed="false">Φωτεινό</button></div><div id="pw"></div></div>
<script>
const P={clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',ok:'<path d="M20 6 9 17l-5-5"/>',warn:'<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3M12 9v4M12 17h.01"/>',spin:'<path d="M21 12a9 9 0 1 1-6.2-8.6"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',cash:'<rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/>',card:'<rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/>',plus:'<path d="M12 5v14M5 12h14"/>',print:'<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/>'};
const s=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const L=(c,i,t)=>`<span class="lb ${c}">${i?s(i):''}${t}</span>`;
const st=(c,i,lab,h,p,a,b)=>`<div class="sh stc ${c}">${L('',i,lab)}<h4>${h}</h4><p>${p}</p><div class="acts">${b?`<span class="btn o">${b}</span>`:''}<span class="btn ${c=='ok'?'a':'o'}">${a}</span></div></div>`;
const O=(a,sel)=>a.map(([n,p,off],i)=>`<i class="${sel.includes(i)?'on':''}${off?' x0':''}">${n}${p?`<small>${p}</small>`:''}</i>`).join('');
const body=`
<div class="sh"><div class="hd"><b>Πληρωμή με μετρητά</b><span class="n">ΑΛΠ 1042</span></div><div class="two">
<div><div class="m">Έδωσε ο πελάτης</div><div class="big">20,00 €</div><div class="qk"><i>Ακριβώς</i><i>15</i><i class="on">20</i><i>50</i></div><div class="kp">${[1,2,3,4,5,6,7,8,9,',',0,'⌫'].map(k=>`<i>${k}</i>`).join('')}</div></div>
<div style="display:flex;flex-direction:column"><div class="rw"><span class="m">Σύνολο</span><b>14,30 €</b></div><div class="rw"><span class="m">Έδωσε</span><b>20,00 €</b></div>
<div style="padding:16px 0"><div class="m">Ρέστα στον πελάτη</div><div class="big ok">5,70 €</div></div>
<div style="margin-top:auto;display:grid;gap:8px"><div class="btn a">Συνέχεια στο Viva Terminal για την απόδειξη</div><div class="btn o">Πίσω στην πώληση</div></div></div></div></div>

<div class="sh"><div class="hd"><b>Μοίρασμα πληρωμής</b><span>Σύνολο 14,30 €</span></div><div style="padding:8px 16px 16px">
<div class="rw"><span>${s('cash')} Μετρητά</span><span style="display:flex;gap:12px;align-items:center">${L('ok','ok','Πληρώθηκε')}<b>10,00 €</b></span></div>
<div class="rw"><span>${s('card')} Κάρτα</span><span style="display:flex;gap:12px;align-items:center">${L('wt','clock','Περιμένει')}<b>4,30 €</b></span></div>
<div class="rw" style="border:0"><span class="m">Υπόλοιπο</span><b>0,00 €</b></div>
<div class="acts"><span class="btn o">${s('plus')}Άλλος τρόπος</span><span class="btn a off">Ολοκλήρωση</span></div><p class="f" style="margin:10px 0 0">Η απόδειξη βγαίνει μόνο όταν πληρωθεί όλο το ποσό.</p></div></div>

<div class="sts">
${st('nu','spin','Σε εξέλιξη','Περιμένουμε το Viva Terminal','Κάρτα · 14,30 €. Η οθόνη αλλάζει μόνη της μόλις τελειώσει.','Viva Terminal','Έλεγχος πληρωμής')}
${st('ok','ok','Ολοκληρώθηκε','Πληρώθηκε 14,30 €','Κάρτα · απόδειξη ΑΛΠ 1042.','Νέα πώληση',s('print')+'Εκτύπωση')}
${st('wt','clock','Περιμένει','Δεν ξέρουμε ακόμα αν πληρώθηκε','Η Viva δεν απάντησε. Ρωτάμε ξανά μόνοι μας. Μην χρεώσεις ξανά τον πελάτη.','Έλεγξε ξανά τώρα')}
${st('bd','warn','Θέλει ενέργεια','Η πληρωμή δεν έγινε','Ο πελάτης δεν χρεώθηκε. Η πώληση είναι όπως την άφησες.','Ξανά με κάρτα','Με μετρητά')}
${st('wt','clock','Περιμένει','Έμεινε μια πληρωμή στη μέση','Η εφαρμογή έκλεισε πριν μάθουμε αν πληρώθηκε: 14,30 €, κάρτα, 12:38.','Έλεγξε αν πληρώθηκε')}
${st('nu','spin','Σε εξέλιξη','Περιμένουμε την πληρωμή IRIS','IRIS · 14,30 €. Ο πελάτης πληρώνει από το κινητό του. Ίδιες καταστάσεις με την κάρτα.','Έλεγχος πληρωμής')}
${st('bd','warn','Θέλει ενέργεια','Δεν υπάρχει σύνδεση','Το ταμείο δεν μπορεί να βγάλει απόδειξη χωρίς internet. Η πώληση που έγραψες μένει στη συσκευή.','Δοκίμασε ξανά')}
${st('bd','warn','Θέλει ενέργεια','Το ταμείο αποσυνδέθηκε','Το κλειδί της συσκευής δεν ισχύει. Ζήτα νέο κωδικό σύζευξης από τον διαχειριστή.','Νέα σύζευξη')}
</div>

<div class="sh"><div class="hd"><b>Χωνάκι 2 μπάλες</b><span>4,00 €</span></div>
<div class="gp"><div class="gh"><b>Χωνάκι</b><span class="m">διάλεξε 1</span>${L('ok','ok','Έτοιμο')}</div><div class="op">${O([['Απλό'],['Βάφλας','+0,60'],['Σοκολάτας','+0,50'],['Κύπελλο αντί για χωνάκι']],[1])}</div></div>
<div class="gp"><div class="gh"><b>Γεύσεις</b><span class="m">διάλεξε 2</span>${L('bd','warn','Λείπει 1')}</div><div class="op">${O([['Φιστίκι Αιγίνης','+0,30'],['Σοκολάτα bitter'],['Βανίλια'],['Φράουλα'],['Γιαούρτι μέλι'],['Καραμέλα'],['Λεμόνι σορμπέ','',1],['Stracciatella']],[0])}</div></div>
<div class="gp"><div class="gh"><b>Έξτρα</b><span class="m">προαιρετικά, όσα θέλει</span></div><div class="op">${O([['Σαντιγί','+0,60'],['Σιρόπι σοκολάτας','+0,40'],['Ξηροί καρποί','+0,70'],['Τρούφα','+0,30']],[0])}</div></div>
<div class="gp"><div class="gh"><b>Χωρίς</b><span class="m">προαιρετικά, δεν αλλάζει η τιμή</span></div><div class="op">${O([['Χωρίς ζάχαρη'],['Χωρίς γλουτένη'],['Χωρίς λακτόζη'],['Σημείωση…']],[])}</div></div>
<div class="ft"><div class="stp"><i>−</i><b>1</b><i>+</i></div><span class="m" style="flex:1">4,00 + 0,60 βάφλας + 0,30 φιστίκι + 0,60 σαντιγί</span><div class="btn a off" style="min-width:220px;justify-content:space-between"><span>Προσθήκη</span><span>5,50 €</span></div></div></div>

<div class="sh"><div class="hd"><b>Καπουτσίνο διπλός</b><span>3,20 €</span></div>
<div class="gp"><div class="gh"><b>Ζάχαρη</b><span class="m">διάλεξε 1</span>${L('ok','ok','Έτοιμο')}</div><div class="op">${O([['Σκέτος'],['Μέτριος'],['Γλυκός'],['Με στέβια']],[0])}</div></div>
<div class="gp" style="border:0"><div class="gh"><b>Γάλα</b><span class="m">διάλεξε 1</span>${L('ok','ok','Έτοιμο')}</div><div class="op">${O([['Πλήρες'],['Ελαφρύ'],['Βρώμης','+0,40'],['Αμυγδάλου','+0,40']],[2])}</div></div></div>`;
const T=[['Μετρητά','Πληκτρολόγιο, γρήγορα ποσά και ρέστα. Το πράσινο είναι το ποσό που δίνεις πίσω. Η απόδειξη βγαίνει από το Viva Terminal, όπως και σήμερα.'],['Μοίρασμα σε δύο τρόπους · νέο στον server','Κάθε μέρος έχει τη δική του κατάσταση.'],['Οι οκτώ καταστάσεις πληρωμής','Ένα πλαίσιο, ίδια θέση για τίτλο, εξήγηση και ενέργεια. Το χρώμα πάνω δείχνει την κατάσταση.'],['Επιλογές προϊόντος (modifiers) · νέο στον server','Τέσσερα είδη ομάδας: μία επιλογή, πολλές με όριο, έξτρα με χρέωση, αφαίρεση. Όσο λείπει υποχρεωτική επιλογή, το κουμπί μένει σβηστό.'],['Το ίδιο πλαίσιο για καφέ','Οι ομάδες ορίζονται ανά προϊόν από την κονσόλα.']];
const pw=document.getElementById('pw'),z=Math.min(1,(innerWidth-2)/800);
const draw=t=>{const parts=body.split('\n\n');pw.innerHTML=parts.map((h,i)=>`<h3>${T[i][0]}</h3><p class="cap">${T[i][1]}</p><div style="zoom:${z}"><div class="x ${t}" style="width:766px">${h}</div></div>`).join('')};
document.querySelector('.tg').addEventListener('click',e=>{const t=e.target.dataset.t;if(t==null)return;document.querySelectorAll('.tg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));draw(t)});draw('');
</script>
